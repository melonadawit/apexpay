# Nginx WAF + Rate Limit + Security Hardening per Day 5 spec
# Best practice: non-root, TLS, SSRF block private ranges, Fayda OTP rate limit 5/hour Lua, IP allowlist admin

worker_processes auto;
events { worker_connections 1024; }

http {
    # Rate limit zones - optimal token bucket O(1)
    limit_req_zone $binary_remote_addr zone=fayda_otp:10m rate=5r/h; # Fayda OTP 5/hour per IP per spec
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # IP allowlist for admin - per Day 5 IP allowlist admin
    geo $admin_allowed {
        default 0;
        # Addis Ababa office IPs - example
        196.188.0.0/16 1; # Ethio Telecom range example
        172.16.0.0/12 0; # private blocked
        10.0.0.0/8 0;
        192.168.0.0/16 0;
        127.0.0.0/8 0;
    }

    # WAF rules - SSRF block private ranges for webhooks
    map $request_uri $is_private_attempt {
        default 0;
        "~*127\.0\.0\.1" 1;
        "~*localhost" 1;
        "~*10\." 1;
        "~*192\.168\." 1;
        "~*172\.1[6-9]\." 1;
        "~*172\.2[0-9]\." 1;
        "~*172\.3[0-1]\." 1;
    }

    upstream api {
        server api:8080;
    }

    server {
        listen 80;
        server_name api.apexpay.et;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;" always;

        # WAF block private attempt
        if ($is_private_attempt) {
            return 403 '{"code":"forbidden","message":"SSRF blocked private range"}';
        }

        # Fayda OTP rate limit 5/hour per Day 5 spec
        location /v1/onboarding/fayda/verify/ {
            limit_req zone=fayda_otp burst=5 nodelay;
            # Lua token bucket Redis would be here: access_by_lua_file /etc/nginx/lua/fayda_rate_limit.lua
            proxy_pass http://api;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Admin IP allowlist per Day 5
        location /v1/admin/ {
            if ($admin_allowed = 0) {
                return 403 '{"code":"forbidden","message":"admin IP not allowed, IP allowlist"}';
            }
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://api;
        }

        # General API
        location /v1/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Request-Id $request_id;
        }

        location /metrics {
            # IP allowlist for metrics
            allow 10.0.0.0/8;
            deny all;
            proxy_pass http://api;
        }

        # Checkout WebSocket or SSE for RAG streaming
        location /v1/compliance/ask {
            proxy_pass http://api;
            proxy_buffering off;
            proxy_set_header Connection "";
            chunked_transfer_encoding on;
        }
    }

    # Checkout-web
    server {
        listen 80;
        server_name checkout.apexpay.et;
        location / {
            proxy_pass http://checkout-web:3001;
        }
    }

    # Merchant-web
    server {
        listen 80;
        server_name merchant.apexpay.et;
        location / {
            proxy_pass http://merchant-web:3000;
        }
    }
}

