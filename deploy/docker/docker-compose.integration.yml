services:
  seed-integration:
    image: postgres:16-alpine
    environment: { PGPASSWORD: apexpay_dev }
    volumes:
      # SQL seed file drives the integration smoke test (see tests/integration/seed.sql).
      - "../../tests/integration/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until pg_isready -h postgres -U apexpay; do sleep 1; done
        psql -h postgres -U apexpay -d apexpay -v ON_ERROR_STOP=1 -f /docker-entrypoint-initdb.d/seed.sql
    depends_on: { migrate: { condition: service_completed_successfully } }

  integration:
    image: curlimages/curl:8.10.1
    volumes: ["../../scripts/integration/api_smoke.sh:/tests/api_smoke.sh:ro"]
    entrypoint: ["/bin/sh", "/tests/api_smoke.sh"]
    depends_on: { api: { condition: service_started }, seed-integration: { condition: service_completed_successfully } }
