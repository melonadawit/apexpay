name: CI — Build + Test + Security Hardening

# The repository default branch is `master` (not `main`). Triggering on the wrong branch
# meant this pipeline never ran, so a non-compiling refactor shipped unnoticed. Corrected.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # -------- Build gate: fail fast if the Go code does not compile / vet / test. --------
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: go mod tidy (no drift)
        run: |
          cd services/api
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod/go.sum drifted — run 'go mod tidy'" && exit 1)
      - name: gofmt (no unformatted files)
        run: |
          unformatted=$(gofmt -l services/api/...)
          if [ -n "$unformatted" ]; then echo "Unformatted files:"; echo "$unformatted"; exit 1; fi
      - name: go build ./...
        run: cd services/api && go build ./...
      - name: go vet ./...
        run: cd services/api && go vet ./...
      - name: go test ./...
        run: cd services/api && go test ./... -count=1

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks no secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --verbose --redact --config .gitleaks.toml

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Gosec high 0
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./services/api/...
          gosec -severity high -confidence high ./services/api/... || (echo "Gosec high severity >0" && exit 1)

  no-float-money-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No float money custom lint
        run: |
          ! grep -R "float64.*amount\|amount.*float64" --include="*.go" services/api/internal/payment services/api/internal/ledger services/api/internal/refund services/api/internal/payout services/api/internal/payroll services/api/internal/worker || (echo "Float money found! Use decimal.Decimal per DATABASE" && exit 1)
          echo "No float money ✓"

  fin-privacy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: FIN privacy — no plain FIN in logs, only last4, hash integrity
        run: |
          ! grep -R "log.*FIN\|fmt.*FIN" --include="*.go" services/api/internal/fayda | grep -v "fin_last4" | grep -v "fin_hash" || (echo "Potential plain FIN log found! Use fin_last4 only" && exit 1)
          echo "FIN privacy ✓ only last4 + hash"

  audit-append-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check audit_logs append-only trigger
        run: |
          grep -R "audit_logs" db/migrations/*.up.sql | grep -i "trigger\|append.only\|immutable" || echo "Add trigger: CREATE TRIGGER audit_no_update BEFORE UPDATE OR DELETE ON audit_logs FOR EACH ROW EXECUTE FUNCTION prevent_update()"
          echo "Audit append-only check done"

  lighthouse-axe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lighthouse + Axe placeholder
        run: |
          echo "Full runs in scripts/audit/lighthouse.js + contract_test.js (require running app locally)"
